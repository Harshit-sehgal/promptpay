name: ateva

# Docker Compose reference for Ateva.
#
# Profiles:
#   (default)  — postgres, redis, api, web (local dev / demo)
#   test       — adds `postgres-test` (a fresh, isolated DB on :5433) for
#                running the integration suite without touching the dev DB:
#                  docker compose --profile test up -d postgres-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ateva
      POSTGRES_USER: ateva
      POSTGRES_PASSWORD: ateva-dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ateva -d ateva']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated Postgres for the integration test suite (profile `test`). Keeps
  # the dev DB untouched when running `pnpm --filter ateva-api test`.
  postgres-test:
    image: postgres:16-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: ateva_test
      POSTGRES_USER: ateva
      POSTGRES_PASSWORD: ateva-test
    ports:
      - '5433:5432'
    volumes:
      - pgtestdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ateva -d ateva_test']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # Production/staging deployments set ATEVA_API_IMAGE to an immutable
    # registry digest. Local compose retains this predictable development tag.
    image: ${ATEVA_API_IMAGE:-ateva-api:local}
    restart: unless-stopped
    build:
      context: .
      target: api
      # Supply-chain attestations are required for release images but are NOT
      # supported by Docker's default `docker` driver — with them hardcoded on,
      # a stock `docker compose build` failed for everyone with
      # "Attestation is not supported for the docker driver" (A-092). Making
      # them env-driven fixed the DRIVER problem but not the SCHEMA one: the
      # compose plugin on ubuntu-latest rejects the keys outright with
      # "services.api.build additional properties 'provenance', 'sbom' not
      # allowed", and it validates the WHOLE file — so `build web` failed on
      # api's keys. That broke the docker-build gate and would have broken the
      # staging release build identically. Attestations are therefore applied
      # by the release workflow with explicit buildx flags, which are portable,
      # rather than by compose keys that only some versions understand.
      args:
        JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
        JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
        JWT_ISSUER: ${JWT_ISSUER:-ateva}
        JWT_AUDIENCE: ${JWT_AUDIENCE:-ateva-client}
    ports:
      - '4002:4002'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ateva:ateva-dev@postgres:5432/ateva}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # ── WARNING: Dev-only secrets ──
      # These are visible to anyone who can read this file. Production deploys
      # MUST override EVERY one of these via a .env file, Docker secrets, or
      # your secrets manager.
      # The @ateva/config refine() rejects keys containing "change-me" or
      # "replace-with" — placeholders below are crafted to pass validation
      # while being trivially distinguishable from real secrets.
      JWT_SECRET: ${JWT_SECRET:-dev-only-docker-compose-jwt-secret-at-least-32-char}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
      JWT_ISSUER: ${JWT_ISSUER:-ateva}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ateva-client}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      API_PORT: '4002'
      GOOGLE_CLIENT_ID: '53592884041-8ctl5qb8dm99p9a5e7hf4gthgmgenabl.apps.googleusercontent.com'
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      # docker-compose is a developer convenience — run with dev NODE_ENV so the
      # google-token verifier's mock path remains available. Production deploys
      # must override NODE_ENV=production AND set real secrets.
      NODE_ENV: ${NODE_ENV:-development}
      # Enable the mock-google-token path so local dev can sign in without a
      # real Google account. The verifier requires BOTH NODE_ENV !== 'production'
      # AND an explicit flag — never set this in staging/production.
      ALLOW_MOCK_GOOGLE: ${ALLOW_MOCK_GOOGLE:-true}
      ATEVA_ENVIRONMENT_KIND: ${ATEVA_ENVIRONMENT_KIND:-development}
      ATEVA_ENVIRONMENT_ID: ${ATEVA_ENVIRONMENT_ID:-local-compose}
      ENABLE_STAGING_FAUCET: ${ENABLE_STAGING_FAUCET:-false}
      ALLOWED_COUNTRIES: ${ALLOWED_COUNTRIES:-}
      ALLOWED_CURRENCIES: ${ALLOWED_CURRENCIES:-}
      VERIFIED_DETECTOR_VERSIONS: ${VERIFIED_DETECTOR_VERSIONS:-}
      # Independently operated providers only. Their public keys and emitted
      # versions are separate from client detector-version allowlists.
      WAIT_ATTESTATION_ISSUERS: ${WAIT_ATTESTATION_ISSUERS:-}
      VERIFIED_WAIT_ATTESTATION_VERSIONS: ${VERIFIED_WAIT_ATTESTATION_VERSIONS:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ateva.local}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      # Sentry — uncomment to enable error monitoring locally
      # SENTRY_DSN: https://your-dsn@o123456.ingest.sentry.io/654321
      # SENTRY_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:4002/api/v1/health/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # The entrypoint runs `prisma migrate deploy` BEFORE Nest boots, and a
      # cold database applies all migrations first. `start_period` is the
      # window Docker provides for exactly this — failures inside it do not
      # count toward `retries`, so a slow first boot is not treated as a sick
      # container. At 30s a fresh database reported the api as unhealthy and
      # `depends_on: service_healthy` then failed the web container with
      # "dependency failed to start", even though the API was migrating
      # normally and became healthy moments later.
      # This also matters in production: the documented cold-start path runs
      # `docker compose up -d --wait` against an empty database.
      start_period: 180s

  web:
    # See api.image: CI supplies a content-addressed image for release hosts.
    image: ${ATEVA_WEB_IMAGE:-ateva-web:local}
    restart: unless-stopped
    build:
      context: .
      target: web
      # See api.build — attestations come from buildx flags, not compose keys.
      # Next.js inlines these at *build* time — runtime `environment:` below
      # does NOT reach the Edge middleware or the client bundle (A-083). Pass
      # real production values here; the ${VAR:-default} fallbacks match the
      # dev-runtime `environment:` block so local `docker compose up` works.
      args:
        JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
        JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
        JWT_ISSUER: ${JWT_ISSUER:-ateva}
        JWT_AUDIENCE: ${JWT_AUDIENCE:-ateva-client}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4002/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-53592884041-8ctl5qb8dm99p9a5e7hf4gthgmgenabl.apps.googleusercontent.com}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND: ${NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND:-development}
        NEXT_PUBLIC_ALLOW_MOCK_AUTH: ${NEXT_PUBLIC_ALLOW_MOCK_AUTH:-"true"}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4002/api/v1}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4002/api/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-53592884041-8ctl5qb8dm99p9a5e7hf4gthgmgenabl.apps.googleusercontent.com}
      NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND: ${NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-docker-compose-jwt-secret-at-least-32-char}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
      JWT_ISSUER: ${JWT_ISSUER:-ateva}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ateva-client}
      # Match the api service — dev convenience compose uses NODE_ENV=development
      # so the mock-google sign-in button remains available for local testing.
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_ALLOW_MOCK_AUTH: ${NEXT_PUBLIC_ALLOW_MOCK_AUTH:-true}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
    # Mirror the Dockerfile HEALTHCHECK so `docker compose` can order
    # dependents and report container health (the image healthcheck alone is
    # not exposed as compose service state).
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  pgtestdata:
