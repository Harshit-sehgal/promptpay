packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

overrides:
  # Security floors for transitive Next/Sentry and AJV dependency paths.
  # Keep these explicit until the direct packages raise their own lower bounds.
  fast-uri: 3.1.5
  multer: 2.2.0
  postcss: 8.5.23
  find-my-way: 9.7.0
  valibot: 1.4.2
  undici: 7.29.0
  'brace-expansion@^1.1.0': 1.1.18
  'brace-expansion@^5.0.0': 5.0.9
  sharp: 0.35.0
  # GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 (high, CWE-407): quadratic CPU
  # consumption resolving `!!omap` in js-yaml <4.3.1. Reaches production
  # through `@nestjs/swagger`, plus dev-only paths via `@nestjs/cli` and
  # `@vscode/vsce`. Scoped to the ^4 range so consumers expecting the 4.x API
  # are not forced onto 5.x. Advisory published after 2026-08-07; the fix is
  # a patch release, so drop this override once the direct parents raise their
  # own lower bounds.
  'js-yaml@^4.0.0': 4.3.1
  # GHSA-pm4m-ph32-ghv5 (high): the same class of defect in the js-yaml 5 line,
  # patched in 5.2.2. main never carried js-yaml 5 at all — @nestjs/swagger
  # 11.4.6 is what introduces it, so the bump brings the advisory with it. The
  # ^4 floor above cannot reach a 5.x resolution; ranges are scoped per major,
  # exactly as with brace-expansion.
  'js-yaml@^5.0.0': 5.2.2
  # GHSA-2v37-7h3g-55p8 / nanoid <3.3.18 (high): a custom generator can loop
  # indefinitely when `size` is zero — the 3.3.17 fix (A-111) was incomplete
  # and a second advisory with the same title was published against it,
  # patched in 3.3.18. Reaches the tree only through build tooling
  # (@sentry/nextjs -> webpack -> terser-webpack-plugin -> postcss -> nanoid,
  # and next -> postcss -> nanoid), but @sentry/nextjs is a production
  # dependency of apps/web so `pnpm audit --prod` gates on it. Scoped to the ^3
  # range: the whole tree resolves to a single nanoid 3.3.x today, and a bare
  # `nanoid:` override would also rewrite any future 5.x consumer. Drop this
  # once postcss raises its own lower bound.
  'nanoid@^3.0.0': 3.3.18
  # GHSA-ggr8-5vv4-36mx / deepmerge-ts <8.0.0 (high, CWE-674): stack exhaustion
  # when merging recursive object graphs. Sole consumer is @prisma/config
  # (prisma 7.9.0 -> @prisma/config 7.9.0 -> deepmerge-ts 7.1.5), which uses
  # only the default `deepmerge` export on plain config objects. The 8.0.0
  # breaking changes (deepmergeInto mutation semantics, metadata type renames,
  # map-merge internals) are all in APIs @prisma/config does not call — verified
  # against its compiled dist (no `deepmergeInto`/`metaMeta`/`mergeInfo`
  # references). Drop this once Prisma raises its own lower bound.
  'deepmerge-ts': 8.0.1
  # COMPATIBILITY HOLD, not a security floor. Prisma 7.9.1 breaks packages/db's
  # typecheck:
  #   src/index.ts: TS2345: Argument of type 'PoolConfig' is not assignable to
  #   parameter of type 'string | Pool | PoolConfig'
  # The adapter's expected `pg` types stopped matching what @types/pg describes.
  # Verified it is 7.9.1 and not @types/pg: pinning @types/pg back to 8.20.0 (the
  # version main runs green) did NOT fix it, while main on 7.9.0 with the same
  # @types/pg is green. A caret cannot express this — the break arrived in a
  # patch release — so it is held here until the adapter and the pg types agree
  # again. Re-test by removing these three lines.
  '@prisma/client': 7.9.0
  '@prisma/adapter-pg': 7.9.0
  prisma: 7.9.0
  # COMPATIBILITY HOLD. Stripe 22.4.0 moves its pinned API version from
  # 2026-06-24.dahlia to 2026-07-29.dahlia, and the SDK types enforce it:
  #   stripe.provider.ts: TS2322: Type '"2026-06-24.dahlia"' is not assignable
  #   to type '"2026-07-29.dahlia"'
  # The type error is trivial to silence by editing the string — and that is
  # exactly the wrong move. Changing the API version changes object shapes and
  # webhook event payloads on a live payments integration. Adopting it is a
  # deliberate migration (read the Stripe changelog, re-verify the deposit
  # session and every webhook handler against the new shapes, re-run the
  # sandbox deposit flow), not a side effect of a routine bump.
  stripe: 22.3.1
  # COMPATIBILITY HOLD. redis 6.2.0 stops honouring the connect timeout the way
  # 6.1 did. `reliability-infrastructure` points RuntimeConfigService at a dead
  # port with REDIS_CONNECT_TIMEOUT_MS=100 and asserts onModuleInit() returns
  # inside 2s — 20x headroom — and under 6.2 it does not.
  #
  # That scenario is not incidental: it proves the API degrades gracefully when
  # Redis is unreachable instead of hanging at startup. A-115 was an
  # intermittent startup hang, and this is the same failure class, so adopting
  # 6.2 needs its connect/retry behaviour verified deliberately rather than
  # inherited from a bump.
  redis: 6.1.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Quarantine brand-new package releases for 24 hours. Frozen-lockfile CI uses
# the reviewed graph below; intentional upgrades are retried after this window
# rather than making a just-published artifact immediately installable.
minimumReleaseAge: 1440
