# Standalone single-host production example. It intentionally does not extend
# the repository's development Compose file, so mock authentication, local
# database credentials, source builds, and development NODE_ENV values cannot
# leak into a release. Postgres and Redis are expected to be managed services.
name: ateva-production

services:
  api:
    image: ${ATEVA_API_IMAGE:?Set ATEVA_API_IMAGE to an immutable image@sha256 digest}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '${ATEVA_API_BIND_ADDRESS:-127.0.0.1}:${ATEVA_API_PORT:-4002}:4002'
    environment:
      # This file runs shipped artifacts only. Staging uses the same optimized
      # production Node semantics; product identity is selected separately by
      # ATEVA_ENVIRONMENT_KIND.
      NODE_ENV: production
      ATEVA_ENVIRONMENT_KIND: ${ATEVA_ENVIRONMENT_KIND:-production}
      ATEVA_ENVIRONMENT_ID: ${ATEVA_ENVIRONMENT_ID:?Set a stable deployment identity}
      ENABLE_STAGING_FAUCET: ${ENABLE_STAGING_FAUCET:-false}
      API_PORT: '4002'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL to the public HTTPS origin}
      WEB_BASE_URL: ${WEB_BASE_URL:?Set WEB_BASE_URL to the public HTTPS origin}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      BFF_TRUST_PROXY_HOPS: ${BFF_TRUST_PROXY_HOPS:-1}
      ALLOWED_COUNTRIES: ${ALLOWED_COUNTRIES:?Set the ISO alpha-2 launch allowlist}
      ALLOWED_CURRENCIES: ${ALLOWED_CURRENCIES:?Set the ISO 4217 settlement allowlist}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
      JWT_ISSUER: ${JWT_ISSUER:-ateva}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ateva-client}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      TOTP_SECRET_ENCRYPTION_KEY: ${TOTP_SECRET_ENCRYPTION_KEY:?Set TOTP_SECRET_ENCRYPTION_KEY}
      PRIVACY_HASH_KEY: ${PRIVACY_HASH_KEY:?Set PRIVACY_HASH_KEY}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM to a production sender}
      EMAIL_QUEUE_SECRET: ${EMAIL_QUEUE_SECRET:?Set EMAIL_QUEUE_SECRET}
      EMAIL_PROVIDER_TIMEOUT_MS: ${EMAIL_PROVIDER_TIMEOUT_MS:-10000}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:?Set OPS_ALERT_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_AUTH_TIMEOUT_MS: ${GOOGLE_AUTH_TIMEOUT_MS:-5000}
      ALLOW_MOCK_GOOGLE: 'false'
      MOCK_GOOGLE_ENABLED: '0'
      PAYOUT_REQUIRE_2FA: ${PAYOUT_REQUIRE_2FA:-true}
      PAYOUT_DESTINATION_COOLDOWN_HOURS: ${PAYOUT_DESTINATION_COOLDOWN_HOURS:-24}
      PAYOUT_ENCRYPTION_KEY: ${PAYOUT_ENCRYPTION_KEY:?Set a canonical base64 32-byte payout encryption key}
      PAYOUT_HMAC_KEY: ${PAYOUT_HMAC_KEY:?Set a different canonical base64 32-byte payout HMAC key}
      ATEVA_PAYOUT_PROVIDER_STATUS: ${ATEVA_PAYOUT_PROVIDER_STATUS:-{}}
      VERIFIED_DETECTOR_VERSIONS: ${VERIFIED_DETECTOR_VERSIONS:-}
      # Optional, telemetry-only shadow fact materialization. Keep unset until
      # the operator has approved key custody and retention for this dataset.
      ATTENTION_SHADOW_PSEUDONYM_KEY: ${ATTENTION_SHADOW_PSEUDONYM_KEY:-}
      ATTENTION_SHADOW_FACT_INTERVAL_MS: ${ATTENTION_SHADOW_FACT_INTERVAL_MS:-900000}
      # A null Compose mapping passes the value through when configured and
      # omits it when absent. An empty string is invalid for this optional JSON.
      WAIT_ATTESTATION_ISSUERS:
      VERIFIED_WAIT_ATTESTATION_VERSIONS: ${VERIFIED_WAIT_ATTESTATION_VERSIONS:-}
      WEBHOOK_RECLAIM_CRON: 'true'
      WEBHOOK_ASYNC_PROCESSING: 'false'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      WISE_API_TOKEN: ${WISE_API_TOKEN:-}
      WISE_PROFILE_ID: ${WISE_PROFILE_ID:-}
      WISE_MODE: ${WISE_MODE:-sandbox}
      WISE_EMAIL_RECIPIENTS_VERIFIED: ${WISE_EMAIL_RECIPIENTS_VERIFIED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  web:
    image: ${ATEVA_WEB_IMAGE:?Set ATEVA_WEB_IMAGE to an immutable image@sha256 digest}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '${ATEVA_WEB_BIND_ADDRESS:-127.0.0.1}:${ATEVA_WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      ATEVA_REQUIRE_DEPLOY_ENV: '1'
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4002/api/v1}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:?Set NEXT_PUBLIC_WEB_URL}
      NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND: ${NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND:-production}
      NEXT_PUBLIC_ALLOW_MOCK_AUTH: 'false'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
      JWT_ISSUER: ${JWT_ISSUER:-ateva}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ateva-client}
      BFF_TRUST_PROXY_HOPS: ${BFF_TRUST_PROXY_HOPS:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      api:
        condition: service_healthy
