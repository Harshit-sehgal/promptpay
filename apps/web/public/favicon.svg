<!--
  The Ateva mark, matching src/components/brand-mark.tsx.

  Previously a teal badge holding "W" — the last surviving piece of the
  WaitLayer identity, and the most visible one, since a favicon sits in every
  tab and every bookmark. It survived the rename because the letter is a bare
  glyph in an SVG, which neither a search for "WaitLayer" nor the JSX sweep that
  fixed the other sixteen surfaces could match.

  Rendered as a filled badge rather than bare bars: a favicon is composited onto
  a tab strip whose colour the page does not control, and bare dark bars vanish
  against a dark strip. The badge carries its own background so the mark reads
  the same in either theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ateva">
  <rect width="32" height="32" rx="8" fill="#17191c"/>
  <rect x="7" y="8.5" width="18" height="3.6" rx="1.2" fill="#ffffff"/>
  <rect x="7" y="14.2" width="18" height="3.6" rx="1.2" fill="#ffffff"/>
  <rect x="7" y="19.9" width="12" height="3.6" rx="1.2" fill="#fbe1d1"/>
</svg>
