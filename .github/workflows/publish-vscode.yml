name: Publish VS Code Extension

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packaged VSIX to Visual Studio Marketplace after smoke tests pass
        type: boolean
        default: false

# A release event and a manual dispatch must not race into marketplace publish.
concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @ateva/db generate
      - name: Build VS Code extension
        run: pnpm --filter ateva-vscode build
      - name: Package VSIX
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/vscode"
          pnpm run package:vsix -- "$GITHUB_WORKSPACE/artifacts/vscode/ateva-vscode.vsix"
        working-directory: apps/vscode-extension
      - name: Smoke test VSIX metadata
        run: |
          test -s artifacts/vscode/ateva-vscode.vsix
          rm -rf /tmp/ateva-vsix
          mkdir -p /tmp/ateva-vsix
          unzip -q artifacts/vscode/ateva-vscode.vsix -d /tmp/ateva-vsix
          cp /tmp/ateva-vsix/extension/package.json /tmp/ateva-vscode-package.json
          node -e "const pkg = require('/tmp/ateva-vscode-package.json'); const url = pkg.contributes.configuration.properties['ateva.apiUrl'].default; if (url !== 'https://api.ateva.com/api/v1') throw new Error('Unexpected ateva.apiUrl default: ' + url);"
          node scripts/verify-vsix-artifact.cjs /tmp/ateva-vsix/extension
          node apps/vscode-extension/scripts/verify-isolated-artifact.cjs /tmp/ateva-vsix/extension
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ateva-vscode-vsix
          path: artifacts/vscode/ateva-vscode.vsix
          if-no-files-found: error

  publish-marketplace:
    needs: package-vscode
    # Publish on a published release, or on an explicit manual dispatch toggle.
    # The `release: published` trigger existed but never published — the job
    # only ran for workflow_dispatch, silently dropping release events.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode-marketplace
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ateva-vscode-vsix
          path: artifacts/vscode
      - name: Publish VSIX to Marketplace
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath artifacts/vscode/ateva-vscode.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
