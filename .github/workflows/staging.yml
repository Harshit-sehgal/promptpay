name: Staging Release Gate

# PR-triggered runs can only verify the definition; the staging gate itself is
# triggered manually (workflow_dispatch) so a human controls when staging is
# mutated and when production is promoted. Both gates require environment
# approval (configured in repo Settings > Environments).
on:
  workflow_dispatch:
    inputs:
      full_flow:
        description: 'Run the mandatory financial loop (P0 #7). Disabling it fails the gate.'
        required: false
        type: boolean
        default: true
      initial_production_deploy:
        description: 'First production deploy only: allow no predecessor images after production approval'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Serialize release mutations. Never cancel a run while it may be applying a
# migration, replacing containers, or rolling back a failed canary.
concurrency:
  # The staging and production targets are shared across refs. A ref-scoped
  # lock would still let a main dispatch race a release-branch dispatch.
  group: ateva-release
  cancel-in-progress: false

jobs:
  # Re-run the complete CI/security/financial gate on the exact SHA selected
  # by this manual dispatch. A staging approval must never promote a commit
  # whose check set was only inferred from a different main-branch run.
  ci-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    secrets: inherit

  # Every release gate gets a fresh schema. The static STAGING_DATABASE_URL is
  # only the connection template; no prior smoke evidence is reused.
  provision-staging-schema:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    outputs:
      schema: ${{ steps.provision.outputs.schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated staging schema
        id: provision
        run: node scripts/staging-database.mjs provision

  # Apply migrations to the staging database (A-012 release gate) and prove the
  # schema is fully migrated with no drift. Gated by the `staging` environment
  # so no staging mutation happens without approval.
  migrate-staging:
    needs: [ci-gate, provision-staging-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_DATABASE_SCHEMA: ${{ needs.provision-staging-schema.outputs.schema }}
      JWT_PRIVATE_KEY: ${{ secrets.STAGING_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.STAGING_JWT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve isolated staging schema URL
        run: echo "DATABASE_URL=$(node scripts/staging-database.mjs url)" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: pnpm --filter @ateva/db generate
      - name: Apply migrations to staging
        run: pnpm --filter @ateva/db migrate:deploy
      - name: Assert no pending migrations
        run: pnpm --filter @ateva/db migrate:status
      - name: Assert migration-built schema has no drift
        run: pnpm --filter @ateva/db migrate:drift

  # Boot/deploy the staging build and run the end-to-end smoke (deploy staging,
  # run migrations, create a test campaign, run extension->ledger flow, process
  # a sandbox payout, verify alerts). Gated by `staging` approval.
  staging-smoke:
    needs: [ci-gate, migrate-staging, provision-staging-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    outputs:
      api_digest: ${{ steps.staging-images.outputs.api_digest }}
      web_digest: ${{ steps.staging-images.outputs.web_digest }}
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_DATABASE_SCHEMA: ${{ needs.provision-staging-schema.outputs.schema }}
      JWT_PRIVATE_KEY: ${{ secrets.STAGING_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.STAGING_JWT_PUBLIC_KEY }}
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
      STAGING_FULL_FLOW: ${{ inputs.full_flow == true && '1' || '0' }}
      STAGING_WAIT_ATTESTATION_PROVIDER: ${{ secrets.STAGING_WAIT_ATTESTATION_PROVIDER }}
      STAGING_WAIT_ATTESTATION_BRIDGE_URL: ${{ secrets.STAGING_WAIT_ATTESTATION_BRIDGE_URL }}
      STAGING_WAIT_ATTESTATION_BRIDGE_TOKEN: ${{ secrets.STAGING_WAIT_ATTESTATION_BRIDGE_TOKEN }}
      STAGING_ALLOWED_COUNTRIES: ${{ secrets.STAGING_ALLOWED_COUNTRIES }}
      STAGING_ALLOWED_CURRENCIES: ${{ secrets.STAGING_ALLOWED_CURRENCIES }}
      STAGING_EVIDENCE_FILE: staging-smoke-evidence.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve isolated staging schema URL
        run: echo "DATABASE_URL=$(node scripts/staging-database.mjs url)" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: pnpm --filter @ateva/db generate
      - name: Build workspace packages
        # Smoke test imports built @ateva/shared and @ateva/db packages,
        # so they must be compiled before the script runs.
        run: pnpm run build
      - name: Validate staging deployment configuration
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_WAIT_ATTESTATION_PROVIDER: ${{ secrets.STAGING_WAIT_ATTESTATION_PROVIDER }}
          STAGING_WAIT_ATTESTATION_BRIDGE_URL: ${{ secrets.STAGING_WAIT_ATTESTATION_BRIDGE_URL }}
          STAGING_WAIT_ATTESTATION_ISSUERS: ${{ secrets.STAGING_WAIT_ATTESTATION_ISSUERS }}
          STAGING_WAIT_ATTESTATION_VERSIONS: ${{ secrets.STAGING_WAIT_ATTESTATION_VERSIONS }}
          STAGING_ALLOWED_COUNTRIES: ${{ secrets.STAGING_ALLOWED_COUNTRIES }}
          STAGING_ALLOWED_CURRENCIES: ${{ secrets.STAGING_ALLOWED_CURRENCIES }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          STAGING_DATABASE_SCHEMA: ${{ needs.provision-staging-schema.outputs.schema }}
        run: |
          for required in REGISTRY REGISTRY_USER REGISTRY_PASS STAGING_HOST STAGING_USER STAGING_DEPLOY_KEY STAGING_KNOWN_HOSTS STAGING_DEPLOY_PATH STAGING_WAIT_ATTESTATION_PROVIDER STAGING_WAIT_ATTESTATION_BRIDGE_URL STAGING_WAIT_ATTESTATION_ISSUERS STAGING_WAIT_ATTESTATION_VERSIONS STAGING_ALLOWED_COUNTRIES STAGING_ALLOWED_CURRENCIES STAGING_WEB_URL STAGING_DATABASE_SCHEMA; do
            if [ -z "${!required}" ]; then
              echo "$required secret is required for an actual staging release" >&2
              exit 1
            fi
          done
      - name: Reject reference attestation and invalid promotion inputs
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          STAGING_WAIT_ATTESTATION_PROVIDER: ${{ secrets.STAGING_WAIT_ATTESTATION_PROVIDER }}
          STAGING_WAIT_ATTESTATION_ISSUERS: ${{ secrets.STAGING_WAIT_ATTESTATION_ISSUERS }}
          STAGING_WAIT_ATTESTATION_VERSIONS: ${{ secrets.STAGING_WAIT_ATTESTATION_VERSIONS }}
        run: node scripts/validate-release-inputs.mjs
      - name: Log in to container registry
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      - name: Set up Docker Buildx for attestations
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build API + web images for staging
        run: docker compose -f docker-compose.yml build --push api web
        env:
          # JWT_SECRET is a runtime-only secret; never pass it to docker build.
          # Every build argument below is public configuration or a public key.
          #
          # Attestations are NOT requested here. A-092 made compose's
          # `provenance`/`sbom` keys env-driven to survive the default docker
          # driver, but the compose plugin on ubuntu-latest rejects those keys
          # at SCHEMA level ("additional properties ... not allowed") and
          # validates the whole file — so this build failed before it started,
          # exactly as the CI docker-build gate did. The `DOCKER_ATTEST` switch
          # that used to sit here was therefore decorative: it drove nothing.
          # Supply-chain integrity for these images comes from the cosign
          # keyless signing of the resolved digests below, which is real and
          # verified at promotion. Restoring provenance/SBOM needs explicit
          # buildx flags (`docker buildx bake --provenance --sbom`); tracked as
          # a follow-up rather than left as a switch that pretends to work.
          ATEVA_API_IMAGE: ${{ secrets.CONTAINER_REGISTRY }}/ateva-api:staging-${{ github.sha }}
          ATEVA_WEB_IMAGE: ${{ secrets.CONTAINER_REGISTRY }}/ateva-web:staging-${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}/api/v1
          NEXT_PUBLIC_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND: staging
          NEXT_PUBLIC_ALLOW_MOCK_AUTH: 'false'
      - name: Resolve pushed staging image digests
        id: staging-images
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          API_IMG="$REGISTRY/ateva-api:staging-$GITHUB_SHA"
          WEB_IMG="$REGISTRY/ateva-web:staging-$GITHUB_SHA"
          API_HASH=$(docker buildx imagetools inspect "$API_IMG" --format '{{.Manifest.Digest}}')
          WEB_HASH=$(docker buildx imagetools inspect "$WEB_IMG" --format '{{.Manifest.Digest}}')
          test -n "$API_HASH" || { echo "API image digest could not be resolved" >&2; exit 1; }
          test -n "$WEB_HASH" || { echo "Web image digest could not be resolved" >&2; exit 1; }
          API_DIGEST="${API_IMG%:*}@$API_HASH"
          WEB_DIGEST="${WEB_IMG%:*}@$WEB_HASH"
          echo "api_image=$API_IMG" >> "$GITHUB_OUTPUT"
          echo "web_image=$WEB_IMG" >> "$GITHUB_OUTPUT"
          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed staging images by digest: $API_DIGEST, $WEB_DIGEST"
      - name: Validate resolved staging digests
        env:
          STAGING_API_DIGEST: ${{ steps.staging-images.outputs.api_digest }}
          STAGING_WEB_DIGEST: ${{ steps.staging-images.outputs.web_digest }}
        run: node scripts/validate-release-inputs.mjs --promotion
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign staging image digests with GitHub OIDC
        env:
          API_DIGEST: ${{ steps.staging-images.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.staging-images.outputs.web_digest }}
        run: |
          for image in "$API_DIGEST" "$WEB_DIGEST"; do
            test -n "$image" || { echo "Cannot sign an empty image digest" >&2; exit 1; }
            cosign sign --yes "$image"
          done
      - name: Deploy exact staging image digests
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_WAIT_ATTESTATION_ISSUERS: ${{ secrets.STAGING_WAIT_ATTESTATION_ISSUERS }}
          STAGING_WAIT_ATTESTATION_VERSIONS: ${{ secrets.STAGING_WAIT_ATTESTATION_VERSIONS }}
          STAGING_ALLOWED_COUNTRIES: ${{ secrets.STAGING_ALLOWED_COUNTRIES }}
          STAGING_ALLOWED_CURRENCIES: ${{ secrets.STAGING_ALLOWED_CURRENCIES }}
          API_DIGEST: ${{ steps.staging-images.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.staging-images.outputs.web_digest }}
        run: |
          KEY_FILE="$RUNNER_TEMP/staging_deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/staging_known_hosts"
          printf '%s\n' "$STAGING_DEPLOY_KEY" > "$KEY_FILE"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS=(-i "$KEY_FILE" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          printf '%s\n' "$REGISTRY_PASS" | ssh "${SSH_OPTS[@]}" "$STAGING_USER@$STAGING_HOST" \
            "docker login '$REGISTRY' -u '$REGISTRY_USER' --password-stdin"
          ATTESTATION_ISSUERS_B64=$(printf '%s' "$STAGING_WAIT_ATTESTATION_ISSUERS" | base64 -w0)
          ATTESTATION_VERSIONS_B64=$(printf '%s' "$STAGING_WAIT_ATTESTATION_VERSIONS" | base64 -w0)
          DATABASE_URL_B64=$(printf '%s' "$DATABASE_URL" | base64 -w0)
          ssh "${SSH_OPTS[@]}" "$STAGING_USER@$STAGING_HOST" \
            "set -e; cd '$STAGING_DEPLOY_PATH'; test -f .env.staging; export ATEVA_API_IMAGE='$API_DIGEST'; export ATEVA_WEB_IMAGE='$WEB_DIGEST'; export DATABASE_URL=\"\$(printf '%s' '$DATABASE_URL_B64' | base64 -d)\"; export DIRECT_URL=\"\$DATABASE_URL\"; export NODE_ENV=production; export ATEVA_ENVIRONMENT_KIND=staging; export ATEVA_ENVIRONMENT_ID='staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'; export NEXT_PUBLIC_API_URL='${STAGING_API_URL}/api/v1'; export NEXT_PUBLIC_WEB_URL='$STAGING_WEB_URL'; export NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND=staging; export NEXT_PUBLIC_ALLOW_MOCK_AUTH=false; export ALLOW_MOCK_GOOGLE=false; export MOCK_GOOGLE_ENABLED=0; export ENABLE_STAGING_FAUCET=true; export ALLOWED_COUNTRIES='$STAGING_ALLOWED_COUNTRIES'; export ALLOWED_CURRENCIES='$STAGING_ALLOWED_CURRENCIES'; export WAIT_ATTESTATION_ISSUERS=\"\$(printf '%s' '$ATTESTATION_ISSUERS_B64' | base64 -d)\"; export VERIFIED_WAIT_ATTESTATION_VERSIONS=\"\$(printf '%s' '$ATTESTATION_VERSIONS_B64' | base64 -d)\"; docker compose --env-file .env.staging -f docs/ops/docker-compose.images.example.yml config --quiet; docker compose --env-file .env.staging -f docs/ops/docker-compose.images.example.yml pull; docker compose --env-file .env.staging -f docs/ops/docker-compose.images.example.yml up -d --wait"
      - name: Run staging smoke test against the deployed digest
        run: node scripts/staging-smoke.mjs
        env:
          ENABLE_STAGING_FAUCET: 'true'
          STAGING_ALLOWED_COUNTRIES: ${{ secrets.STAGING_ALLOWED_COUNTRIES }}
          STAGING_ALLOWED_CURRENCIES: ${{ secrets.STAGING_ALLOWED_CURRENCIES }}
          JWT_PRIVATE_KEY: ${{ secrets.STAGING_JWT_PRIVATE_KEY }}
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_WAIT_ATTESTATION_PROVIDER: ${{ secrets.STAGING_WAIT_ATTESTATION_PROVIDER }}
          STAGING_WAIT_ATTESTATION_BRIDGE_URL: ${{ secrets.STAGING_WAIT_ATTESTATION_BRIDGE_URL }}
          STAGING_WAIT_ATTESTATION_BRIDGE_TOKEN: ${{ secrets.STAGING_WAIT_ATTESTATION_BRIDGE_TOKEN }}
          STAGING_API_IMAGE_DIGEST: ${{ steps.staging-images.outputs.api_digest }}
          STAGING_WEB_IMAGE_DIGEST: ${{ steps.staging-images.outputs.web_digest }}
      - name: Upload immutable staging smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-smoke-evidence.json
          if-no-files-found: warn
          retention-days: 90

  # Cleanup is independent of promotion and always runs after the isolated
  # schema has been used. It never drops the shared public schema or any prior
  # staging run's data.
  cleanup-staging-schema:
    needs: [provision-staging-schema, migrate-staging, staging-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_DATABASE_SCHEMA: ${{ needs.provision-staging-schema.outputs.schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Destroy isolated staging schema
        run: |
          if [ -z "$STAGING_DATABASE_SCHEMA" ]; then
            echo "No staging schema was provisioned; nothing to clean up."
            exit 0
          fi
          node scripts/staging-database.mjs destroy

  # Apply and validate production migrations BEFORE any image is allowed to
  # replace the live service. This is intentionally its own environment-gated
  # job so the database transition has an auditable approval boundary.
  migrate-production:
    needs: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production migration configuration
        run: |
          test -n "$DATABASE_URL" || {
            echo "PRODUCTION_DATABASE_URL is required before production promotion" >&2
            exit 1
          }
          if [ -n "$DIRECT_URL" ]; then
            echo "Production migrations will use PRODUCTION_DIRECT_URL."
          else
            echo "PRODUCTION_DIRECT_URL is unset; migrations will fall back to PRODUCTION_DATABASE_URL."
          fi
      - name: Generate Prisma client
        run: pnpm --filter @ateva/db generate
      - name: Apply migrations to production before deploy
        run: pnpm --filter @ateva/db migrate:deploy
      - name: Assert production has no pending migrations or drift
        run: |
          pnpm --filter @ateva/db migrate:status
          pnpm --filter @ateva/db migrate:drift

  # Final approval gate before production. The API artifact is environment-
  # neutral and is promoted by the exact staging-tested digest. The Next.js web
  # artifact is NOT environment-neutral: middleware verification keys and
  # NEXT_PUBLIC_* values are embedded at build time, so production gets a new,
  # attested image built only after the production environment approval.
  promote-production:
    needs: [staging-smoke, migrate-production]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      # PRODUCTION_API_URL must include the /api/v1 prefix.
      # Example: https://api.example.com/api/v1
      PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      PRODUCTION_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx for the production web artifact
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify staging image signatures before API promotion
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          STAGING_API_DIGEST: ${{ needs.staging-smoke.outputs.api_digest }}
          STAGING_WEB_DIGEST: ${{ needs.staging-smoke.outputs.web_digest }}
        run: |
          for required in REGISTRY REGISTRY_USER REGISTRY_PASS STAGING_API_DIGEST STAGING_WEB_DIGEST; do
            if [ -z "${!required}" ]; then
              echo "$required is required before signature verification" >&2
              exit 1
            fi
          done
          echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          EXPECTED_IDENTITY="https://github.com/$GITHUB_WORKFLOW_REF"
          for image in "$STAGING_API_DIGEST" "$STAGING_WEB_DIGEST"; do
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$EXPECTED_IDENTITY" \
              "$image"
          done
      - name: Require immutable staging image digests
        env:
          STAGING_API_DIGEST: ${{ needs.staging-smoke.outputs.api_digest }}
          STAGING_WEB_DIGEST: ${{ needs.staging-smoke.outputs.web_digest }}
        run: node scripts/validate-release-inputs.mjs --promotion
      - name: Build and push production-specific web image
        id: production-web
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          # See staging-smoke: compose-level attestations are unportable; the
          # digest is cosign-signed instead.
          ATEVA_WEB_IMAGE: ${{ secrets.CONTAINER_REGISTRY }}/ateva-web:production-${{ github.sha }}
          JWT_PUBLIC_KEY: ${{ secrets.PRODUCTION_JWT_PUBLIC_KEY }}
          JWT_PUBLIC_KEYS: ${{ secrets.PRODUCTION_JWT_PUBLIC_KEYS }}
          JWT_ISSUER: ${{ secrets.PRODUCTION_JWT_ISSUER || 'ateva' }}
          JWT_AUDIENCE: ${{ secrets.PRODUCTION_JWT_AUDIENCE || 'ateva-client' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
          NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND: production
          NEXT_PUBLIC_ALLOW_MOCK_AUTH: 'false'
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.PRODUCTION_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          SENTRY_AUTH_TOKEN: ${{ secrets.PRODUCTION_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ateva
          SENTRY_PROJECT: javascript-nextjs
        run: |
          for required in REGISTRY REGISTRY_USER REGISTRY_PASS ATEVA_WEB_IMAGE JWT_PUBLIC_KEY NEXT_PUBLIC_API_URL NEXT_PUBLIC_WEB_URL NEXT_PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "$required is required to build the production web artifact" >&2
              exit 1
            fi
          done
          node scripts/validate-release-inputs.mjs --production-web

          echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker compose -f docker-compose.yml build --push web
          WEB_HASH=$(docker buildx imagetools inspect "$ATEVA_WEB_IMAGE" --format '{{.Manifest.Digest}}')
          test -n "$WEB_HASH" || { echo "Production web digest could not be resolved" >&2; exit 1; }
          PRODUCTION_WEB_DIGEST="${ATEVA_WEB_IMAGE%:*}@$WEB_HASH"
          echo "digest=$PRODUCTION_WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Built production web image by digest: $PRODUCTION_WEB_DIGEST"
      - name: Sign and verify the production web digest
        env:
          PRODUCTION_WEB_DIGEST: ${{ steps.production-web.outputs.digest }}
        run: |
          test -n "$PRODUCTION_WEB_DIGEST" || { echo "Cannot sign an empty production web digest" >&2; exit 1; }
          cosign sign --yes "$PRODUCTION_WEB_DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            "$PRODUCTION_WEB_DIGEST"
      - name: Deploy staged API plus production-specific web image
        id: promote
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
          PROD_USER: ${{ secrets.PRODUCTION_USER }}
          PROD_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PROD_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          STAGING_API_DIGEST: ${{ needs.staging-smoke.outputs.api_digest }}
          PRODUCTION_WEB_DIGEST: ${{ steps.production-web.outputs.digest }}
          INITIAL_PRODUCTION_DEPLOY: ${{ inputs.initial_production_deploy == true && '1' || '0' }}
        run: |
          SHA="$GITHUB_SHA"
          for required in REGISTRY REGISTRY_USER REGISTRY_PASS PROD_HOST PROD_USER PROD_DEPLOY_KEY PROD_KNOWN_HOSTS PROD_DEPLOY_PATH STAGING_API_DIGEST PRODUCTION_WEB_DIGEST; do
            if [ -z "${!required}" ]; then
              echo "$required secret or image output is required for production deployment" >&2
              exit 1
            fi
          done

          echo "Logging in to container registry $REGISTRY ..."
          echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

          echo "Deploying staging-tested API $STAGING_API_DIGEST"
          echo "Deploying production-configured web $PRODUCTION_WEB_DIGEST"
          KEY_FILE="$RUNNER_TEMP/production_deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/production_known_hosts"
          printf '%s\n' "$PROD_DEPLOY_KEY" > "$KEY_FILE"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS=(-i "$KEY_FILE" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          printf '%s\n' "$REGISTRY_PASS" | ssh "${SSH_OPTS[@]}" "$PROD_USER@$PROD_HOST" \
            "docker login '$REGISTRY' -u '$REGISTRY_USER' --password-stdin"

          PREVIOUS_API_IMAGE=$(ssh "${SSH_OPTS[@]}" "$PROD_USER@$PROD_HOST" \
            "set -e; cd '$PROD_DEPLOY_PATH'; test -f .env.production; cid=\$(ATEVA_API_IMAGE='$STAGING_API_DIGEST' ATEVA_WEB_IMAGE='$PRODUCTION_WEB_DIGEST' docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml ps -q api || true); if [ -n \"\$cid\" ]; then docker inspect --format '{{.Config.Image}}' \"\$cid\"; fi")
          PREVIOUS_WEB_IMAGE=$(ssh "${SSH_OPTS[@]}" "$PROD_USER@$PROD_HOST" \
            "set -e; cd '$PROD_DEPLOY_PATH'; test -f .env.production; cid=\$(ATEVA_API_IMAGE='$STAGING_API_DIGEST' ATEVA_WEB_IMAGE='$PRODUCTION_WEB_DIGEST' docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml ps -q web || true); if [ -n \"\$cid\" ]; then docker inspect --format '{{.Config.Image}}' \"\$cid\"; fi")

          if [ "$INITIAL_PRODUCTION_DEPLOY" = "1" ]; then
            if [ -n "$PREVIOUS_API_IMAGE" ] || [ -n "$PREVIOUS_WEB_IMAGE" ]; then
              echo "initial_production_deploy was selected, but predecessor containers exist; use the normal deploy path" >&2
              exit 1
            fi
            echo "::warning::Approved first production deploy has no automated rollback predecessor."
            echo "rollback_available=false" >> "$GITHUB_OUTPUT"
          else
            test -n "$PREVIOUS_API_IMAGE" || { echo "No previous API image found; select the approval-gated initial_production_deploy input only for a true first deploy" >&2; exit 1; }
            test -n "$PREVIOUS_WEB_IMAGE" || { echo "No previous web image found; select the approval-gated initial_production_deploy input only for a true first deploy" >&2; exit 1; }
            echo "rollback_available=true" >> "$GITHUB_OUTPUT"
            echo "Captured rollback images: $PREVIOUS_API_IMAGE, $PREVIOUS_WEB_IMAGE"
          fi
          echo "previous_api_image=$PREVIOUS_API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "previous_web_image=$PREVIOUS_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          ssh "${SSH_OPTS[@]}" "$PROD_USER@$PROD_HOST" \
            "set -e; cd '$PROD_DEPLOY_PATH'; test -f .env.production; export ATEVA_API_IMAGE='$STAGING_API_DIGEST'; export ATEVA_WEB_IMAGE='$PRODUCTION_WEB_DIGEST'; export ATEVA_ENVIRONMENT_KIND=production; export NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND=production; export ENABLE_STAGING_FAUCET=false; docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml config --quiet; docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml pull; docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml up -d --wait"

          echo "=== Production image promotion complete ==="
          echo "Commit: ${SHA:0:12}"
          echo "Deployed to: $PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH"
      - name: Post-deploy canary — verify production API is live
        run: |
          for i in $(seq 1 30); do
            HEALTH=$(curl --fail-with-body -s "${PRODUCTION_API_URL}/health/ready" 2>/dev/null || echo "{}")
            STATUS=$(node -e "console.log(JSON.parse(process.argv[1]).status || 'unknown')" "$HEALTH" 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "ok" ]; then
              echo "Production API is live (health/ready → status=ok)"; break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Production API did not become healthy within timeout"; exit 1
            fi
            sleep 5
          done
      - name: Post-deploy canary — verify API version info (migrations up-to-date)
        run: |
          MIG_STATUS=$(curl -sf "${PRODUCTION_API_URL}/health/migrations" 2>/dev/null || echo '{"upToDate":false,"pendingCount":-1}')
          UP_TO_DATE=$(node -e "const b = JSON.parse(process.argv[1]).upToDate; console.log(b === true ? 'true' : 'false')" "$MIG_STATUS" 2>/dev/null || echo "false")
          PENDING=$(node -e "const n = JSON.parse(process.argv[1]).pendingCount; console.log(typeof n === 'number' ? n : -1)" "$MIG_STATUS" 2>/dev/null || echo "-1")
          if [ "$UP_TO_DATE" != "true" ]; then
            echo "Production API reports pending migrations: $PENDING"; exit 1
          fi
          echo "Production API migrations are up to date (pendingCount=$PENDING)"
      - name: Post-deploy canary — verify deployed JWT public key matches the web build
        env:
          EXPECTED_JWT_PUBLIC_KEY: ${{ secrets.PRODUCTION_JWT_PUBLIC_KEY }}
        run: |
          test -n "$EXPECTED_JWT_PUBLIC_KEY" || { echo "PRODUCTION_JWT_PUBLIC_KEY is required" >&2; exit 1; }
          EXPECTED_KID=$(node -e '
            const { createHash } = require("node:crypto");
            const pem = process.env.EXPECTED_JWT_PUBLIC_KEY.replace(/\\n/g, "\n").trim();
            process.stdout.write(createHash("sha256").update(pem).digest("hex").slice(0, 16));')
          JWKS=$(curl --fail-with-body -sS "${PRODUCTION_API_URL}/auth/.well-known/jwks.json")
          EXPECTED_KID="$EXPECTED_KID" JWKS="$JWKS" node -e '
            const body = JSON.parse(process.env.JWKS);
            const key = Array.isArray(body.keys)
              ? body.keys.find((candidate) => candidate.kid === process.env.EXPECTED_KID)
              : undefined;
            if (!key || key.kty !== "RSA" || key.alg !== "RS256" || !key.n || !key.e) {
              throw new Error("deployed API JWKS does not contain the production web build key");
            }'
          echo "Deployed API verification key matches the key embedded in the production web build"
      - name: Post-deploy canary — verify BFF validation routing
        run: |
          WEB_ORIGIN="${PRODUCTION_WEB_URL%/}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$WEB_ORIGIN/api/auth/login" \
            -H 'Content-Type: application/json' -d '{}')
          if [ "$STATUS" != "400" ]; then
            echo "Web BFF returned unexpected status $STATUS (expected 400 for empty login body)"; exit 1
          fi
          echo "Web BFF reached the API and preserved expected input validation (token issuance is covered by the blocking production smoke/E2E gate)"
      - name: Post-deploy canary — verify protected web middleware
        run: |
          WEB_ORIGIN="${PRODUCTION_WEB_URL%/}"
          HEADERS="$RUNNER_TEMP/production-protected-headers"
          STATUS=$(curl -sS -D "$HEADERS" -o /dev/null -w '%{http_code}' "$WEB_ORIGIN/developer")
          case "$STATUS" in
            302|303|307|308) ;;
            *) echo "Protected web route returned $STATUS instead of an auth redirect" >&2; exit 1 ;;
          esac
          LOCATION=$(awk 'tolower($1) == "location:" { print $2 }' "$HEADERS" | tr -d '\r' | tail -1)
          case "$LOCATION" in
            */auth/login*) ;;
            *) echo "Protected web route did not redirect to /auth/login: $LOCATION" >&2; exit 1 ;;
          esac
          echo "Protected web middleware redirected an anonymous request to login"
      - name: Rollback on canary failure
        if: failure() && steps.promote.outputs.rollback_available == 'true'
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
          PROD_USER: ${{ secrets.PRODUCTION_USER }}
          PROD_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PROD_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          PREVIOUS_API_IMAGE: ${{ steps.promote.outputs.previous_api_image }}
          PREVIOUS_WEB_IMAGE: ${{ steps.promote.outputs.previous_web_image }}
        run: |
          echo "=== Canary FAILED — initiating rollback ==="
          for required in REGISTRY REGISTRY_USER REGISTRY_PASS PROD_HOST PROD_USER PROD_DEPLOY_KEY PROD_KNOWN_HOSTS PROD_DEPLOY_PATH PREVIOUS_API_IMAGE PREVIOUS_WEB_IMAGE; do
            if [ -z "${!required}" ]; then
              echo "$required is required for rollback; refusing to claim recovery succeeded" >&2
              exit 1
            fi
          done
          KEY_FILE="$RUNNER_TEMP/production_rollback_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/production_rollback_known_hosts"
          printf '%s\n' "$PROD_DEPLOY_KEY" > "$KEY_FILE"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS=(-i "$KEY_FILE" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          printf '%s\n' "$REGISTRY_PASS" | ssh "${SSH_OPTS[@]}" "$PROD_USER@$PROD_HOST" \
            "docker login '$REGISTRY' -u '$REGISTRY_USER' --password-stdin"
          ssh "${SSH_OPTS[@]}" "$PROD_USER@$PROD_HOST" \
            "set -e; cd '$PROD_DEPLOY_PATH'; test -f .env.production; export ATEVA_API_IMAGE='$PREVIOUS_API_IMAGE'; export ATEVA_WEB_IMAGE='$PREVIOUS_WEB_IMAGE'; export ATEVA_ENVIRONMENT_KIND=production; export NEXT_PUBLIC_ATEVA_ENVIRONMENT_KIND=production; export ENABLE_STAGING_FAUCET=false; docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml config --quiet; docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml pull; docker compose --env-file .env.production -f docs/ops/docker-compose.images.example.yml up -d --wait"
          echo "Rollback completed with the captured predecessor images."
      - name: Record unavailable rollback for failed first deployment
        if: failure() && inputs.initial_production_deploy == true && steps.promote.outputs.rollback_available != 'true'
        run: |
          echo "::error::The approved first production deployment failed and has no predecessor images to restore. Keep traffic closed and follow the cold-start recovery runbook."
      - name: Promote complete
        if: success()
        run: |
          echo "=== Production promotion complete ==="
          echo "Commit:  ${GITHUB_SHA:0:12}"
          echo "Approved by: ${GITHUB_ACTOR}"
