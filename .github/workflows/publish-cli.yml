name: Publish CLI

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packaged CLI tarball to npm after smoke tests pass
        type: boolean
        default: false

# A release event and a manual dispatch must not race into npm publish.
concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  package-cli:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches the CLI package version
        if: github.event_name == 'release' || inputs.publish == true
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "Manual npm publication must be dispatched from a tag, not $REF_TYPE"
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match CLI version $PACKAGE_VERSION (expected v$PACKAGE_VERSION)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @ateva/db generate
      - name: Build CLI
        run: pnpm --filter "ateva-cli..." build
      - name: Verify bin artifacts
        run: pnpm --filter ateva-cli pack:check
      - name: Pack CLI artifact
        run: |
          mkdir -p artifacts/cli
          pnpm --filter ateva-cli pack --pack-destination "$GITHUB_WORKSPACE/artifacts/cli"
      - name: Verify packed manifest has no private runtime dependencies
        shell: bash
        run: |
          shopt -s nullglob
          TARBALLS=(artifacts/cli/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one CLI tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          tar -xOf "${TARBALLS[0]}" package/package.json | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => (body += chunk));
            process.stdin.on("end", () => {
              const pkg = JSON.parse(body);
              for (const section of ["dependencies", "optionalDependencies", "peerDependencies"]) {
                for (const [name, version] of Object.entries(pkg[section] || {})) {
                  if (name.startsWith("@ateva/") || String(version).startsWith("workspace:")) {
                    throw new Error(`packed ${section} contains unresolved ${name}@${version}`);
                  }
                }
              }
            });'
      - name: Smoke install packaged CLI
        shell: bash
        run: |
          CLI_INSTALL_ROOT="$RUNNER_TEMP/ateva-cli-install"
          mkdir -p "$CLI_INSTALL_ROOT"
          npm install --prefix "$CLI_INSTALL_ROOT" --ignore-scripts ./artifacts/cli/*.tgz
          CLI_BIN="$CLI_INSTALL_ROOT/node_modules/.bin/ateva"
          test -x "$CLI_BIN"
          ATEVA_API_URL=https://api.ateva.com/api/v1 "$CLI_BIN" --version
          ATEVA_API_URL=https://api.ateva.com/api/v1 "$CLI_BIN" --help
      - name: Upload CLI package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ateva-cli-package
          path: artifacts/cli/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: package-cli
    # Publish on a published release, or on an explicit manual dispatch toggle.
    # The `release: published` trigger existed but never published — the job
    # only ran for workflow_dispatch, silently dropping release events.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download CLI package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ateva-cli-package
          path: artifacts/cli
      - name: Re-verify artifact version against the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          shopt -s nullglob
          TARBALLS=(artifacts/cli/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one CLI tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          PACKAGE_VERSION=$(tar -xOf "${TARBALLS[0]}" package/package.json | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => (body += chunk));
            process.stdin.on("end", () => process.stdout.write(JSON.parse(body).version));')
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match packed CLI version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Publish CLI to npm
        run: npm publish ./artifacts/cli/*.tgz --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
